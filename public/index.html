<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="color-scheme" content="dark">
<title>Trampo Cláudio — Vagas de emprego em Cláudio, MG</title>
<script>
  // Quem acessa pelo Android é redirecionado direto pra Play Store,
  // sem precisar ver o site no navegador — só iPhone/PC veem o site.
  if (/Android/i.test(navigator.userAgent)) {
    window.location.href = 'https://play.google.com/store/apps/details?id=com.trampoclaudiotemp';
  }
</script>
<meta property="og:title" content="Trampo Cláudio">
<meta property="og:description" content="Vagas de emprego em Cláudio, MG, direto com quem contrata.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
 body {
  background: #0d1009;
  color: #f4f1e8;
  font-family: 'Inter', sans-serif;
  min-height: 100vh;
}
.container {
  max-width: 480px;
  margin: 0 auto;
  padding: 0 0 100px;
  background: #1a1f14;
  min-height: 100vh;
  box-shadow: 0 0 40px rgba(0,0,0,0.4);
}
  .banner-topo { width: 100%; display: block; }
  .hero-top { display: flex; align-items: center; gap: 10px; margin: 20px 0; padding: 0 20px; }
  .selo {
    width: 40px; height: 40px; border-radius: 8px;
    background: #e0a840; display: flex; align-items: center; justify-content: center;
    transform: rotate(-4deg); font-weight: 800; color: #1a1f14;
  }
  .brand-name { font-family: 'Space Grotesk', sans-serif; font-size: 20px; font-weight: 700; }
  .brand-tag { font-size: 12px; color: #b7bbab; }
  h1 { font-family: 'Space Grotesk', sans-serif; font-size: 22px; margin-bottom: 16px; padding: 0 20px; }

  .search-box {
    display: flex; align-items: center; gap: 8px;
    background: #22271d; border: 1px solid #333a28; border-radius: 12px;
    padding: 11px 14px; margin: 0 20px 14px;
  }
  .search-box input {
    background: none; border: none; outline: none; color: #f4f1e8;
    font-size: 14px; width: 100%; font-family: 'Inter', sans-serif;
  }
  .search-box input::placeholder { color: #7a7d6f; }

 .chip-row {
  display: flex; gap: 8px; overflow-x: auto; padding: 0 20px 20px;
  scrollbar-width: thin;
  scrollbar-color: #e0a840 #22271d;
}
.chip-row::-webkit-scrollbar { height: 6px; }
.chip-row::-webkit-scrollbar-track { background: #22271d; border-radius: 10px; }
.chip-row::-webkit-scrollbar-thumb { background: #e0a840; border-radius: 10px; }
  .chip {
    flex-shrink: 0; background: #22271d; border: 1px solid #333a28; border-radius: 100px;
    padding: 8px 14px; font-size: 12.5px; color: #b7bbab; font-weight: 600;
    cursor: pointer; font-family: 'Inter', sans-serif;
  }
  .chip.active { background: #e0a840; border-color: #e0a840; color: #1a1f14; }

  .lista { padding: 0 20px; }
  .card {
    display: block; background: #f4f1e8; color: #1a1f14; border-radius: 14px;
    padding: 14px; margin-bottom: 12px; text-decoration: none;
  }
  .card-cargo { font-weight: 700; font-size: 15px; }
  .card-empresa { font-size: 12.5px; color: #5a5a4f; margin-top: 2px; }
  .card-meta { font-size: 11px; color: #b48a2e; margin-top: 8px; }

  .btn-anunciar {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%);
    background: #e0a840;
    color: #1a1f14;
    text-decoration: none;
    padding: 14px 22px;
    border-radius: 100px;
    font-weight: 700;
    font-size: 14px;
  }

  .loading-state, .error-state { text-align: center; padding-top: 40px; color: #b7bbab; }
</style>
</head>
<body>

<div class="container">
  <img src="/banner-app.png" alt="Trampo Cláudio" class="banner-topo">

  <div class="hero-top">
    <div class="selo">TR</div>
    <div>
      <div class="brand-name">Trampo Cláudio</div>
      <div class="brand-tag">Cláudio, Minas Gerais</div>
    </div>
  </div>
  <h1>Vagas de emprego em Cláudio</h1>

  <div class="search-box">
    <span>🔍</span>
    <input id="busca" type="text" placeholder="Pedreiro, vendedor, diarista...">
  </div>

  <div class="chip-row" id="chips"></div>

  <div class="lista" id="lista">
    <div class="loading-state">Carregando...</div>
  </div>
</div>

<a class="btn-anunciar" href="https://play.google.com/store/apps/details?id=com.trampoclaudiotemp" target="_blank" rel="noopener">
  + Anunciar vaga
</a>

<script>
const API_BASE = window.location.origin;

const AREAS = [
  'Construção', 'Comércio e Vendas', 'Alimentação', 'Domésticos e Cuidados',
  'Logística e Transporte', 'Indústria e Produção', 'Administrativo',
  'Beleza e Estética', 'Saúde', 'Educação', 'Rural e Agropecuária',
  'Segurança e Limpeza', 'Outros',
];

let areaAtiva = null;
let debounceTimer = null;

function renderChips() {
  const el = document.getElementById('chips');
  const chips = [{ label: 'Todas', value: null }, ...AREAS.map(a => ({ label: a, value: a }))];
  el.innerHTML = chips.map(c => `
    <button class="chip ${areaAtiva === c.value ? 'active' : ''}" data-area="${c.value ?? ''}">${c.label}</button>
  `).join('');
  el.querySelectorAll('.chip').forEach(btn => {
    btn.addEventListener('click', () => {
      const val = btn.dataset.area || null;
      areaAtiva = areaAtiva === val ? null : val;
      renderChips();
      carregarLista();
    });
  });
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str || '';
  return div.innerHTML;
}

async function carregarLista() {
  const el = document.getElementById('lista');
  const busca = document.getElementById('busca').value.trim();
  el.innerHTML = '<div class="loading-state">Carregando...</div>';
  try {
    const params = new URLSearchParams();
    if (areaAtiva) params.append('area', areaAtiva);
    if (busca) params.append('cargo', busca);
    const resp = await fetch(`${API_BASE}/vagas?${params.toString()}`);
    if (!resp.ok) throw new Error('erro');
    const vagas = await resp.json();

    if (vagas.length === 0) {
      el.innerHTML = '<div class="error-state">Nenhuma vaga encontrada por aqui ainda.</div>';
      return;
    }

    el.innerHTML = vagas.map(v => `
      <a class="card" href="/vaga.html?id=${v.id}">
        <div class="card-cargo">${escapeHtml(v.cargo)}</div>
        <div class="card-empresa">${escapeHtml(v.empresa_nome)}</div>
        <div class="card-meta">${escapeHtml(v.area)} · ${escapeHtml(v.bairro)}</div>
      </a>
    `).join('');
  } catch (e) {
    el.innerHTML = '<div class="error-state">Não foi possível carregar as vagas agora.</div>';
  }
}

document.getElementById('busca').addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(carregarLista, 400);
});

renderChips();
carregarLista();

document.getElementById('chips').addEventListener('wheel', (e) => {
  if (e.deltaY === 0) return;
  e.preventDefault();
  document.getElementById('chips').scrollLeft += e.deltaY;
});
</script>
</body>
</html>
